<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coffer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Pre-paint theme application. Deliberately duplicated from
      // src/lib/theme.ts: this has to run before the first paint, and a module
      // import cannot — without it every load flashes the light theme before
      // React mounts. theme.test.ts fails if the two ever disagree.
      (function () {
        var fallback = 'light';
        var accentFallback = 'teal';
        try {
          var t = localStorage.getItem('coffer.theme');
          var ok = t === 'light' || t === 'light-hc' || t === 'dark' || t === 'dark-hc';
          document.documentElement.setAttribute('data-theme', ok ? t : fallback);
          var a = localStorage.getItem('coffer.accent');
          var aok = a === 'teal' || a === 'indigo' || a === 'rust';
          document.documentElement.setAttribute('data-accent', aok ? a : accentFallback);
        } catch (e) {
          // Blocked storage (private window, embedded webview) throws on read.
          document.documentElement.setAttribute('data-theme', fallback);
          document.documentElement.setAttribute('data-accent', accentFallback);
        }
      })();
    </script>
  </head>
  <body class="bg-surface-muted text-text font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

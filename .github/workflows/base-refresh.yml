# Rebuilds the latest release on fresh base images, weekly, and records the new digest
# on its GitHub Release. The runtime image floats on mcr.microsoft.com/dotnet/aspnet:10.0
# and PGDG's postgresql-client-16, so without this an install got a patched .NET runtime
# or libpq only when a release was cut.
#
# Same source, same version: the release's tag is checked out and built as release.yml
# builds it, pushed under the same image tags, and image-digest.txt is replaced. An
# install that re-runs install.sh for that version gets the rebuilt image by digest; one
# that does not keeps the image it was given.
#
# Keep runs-on as a GitHub-hosted runner, for the reason release.yml gives.
name: Base image refresh

on:
  schedule:
    # Mondays, 05:17 UTC: off the hour.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# packages:write to push to ghcr; contents:write to replace the release's digest record.
permissions:
  contents: write
  packages: write

concurrency:
  group: base-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild the latest release on fresh base images
    runs-on: ubuntu-latest
    steps:
      - name: Find the latest release
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$(gh api "repos/${{ github.repository }}/releases/latest" --jq .tag_name)"
          case "$tag" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "no release to refresh ('$tag')"; exit 1 ;; esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "minor=$(echo "${tag#v}" | cut -d. -f1,2)" >> "$GITHUB_OUTPUT"

      - name: Checkout the release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.latest.outputs.tag }}
          # Full history: the build number is the commit count (see release.yml).
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve build identity
        id: ident
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(git log -1 --format=%cd --date=short)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          # The point of the job: fresh base layers, and no cached apt layer either.
          pull: true
          no-cache: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            SOURCE_COMMIT_SHA=${{ steps.ident.outputs.sha }}
            SOURCE_COMMIT_COUNT=${{ steps.ident.outputs.count }}
            SOURCE_COMMIT_DATE=${{ steps.ident.outputs.date }}
          # The tags release.yml gave this version; it is the latest release, so
          # `latest` is its too. Labels set explicitly: on a schedule, metadata-action
          # would describe the default branch, not the release.
          tags: |
            ghcr.io/${{ github.repository_owner }}/coffer:${{ steps.latest.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/coffer:${{ steps.latest.outputs.minor }}
            ghcr.io/${{ github.repository_owner }}/coffer:latest
          labels: |
            org.opencontainers.image.title=Coffer
            org.opencontainers.image.version=${{ steps.latest.outputs.version }}
            org.opencontainers.image.revision=${{ steps.ident.outputs.revision }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Record the new digest on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.latest.outputs.tag }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          printf '%s' "$DIGEST" | grep -qE '^sha256:[0-9a-f]{64}$' || { echo "no digest: '$DIGEST'"; exit 1; }
          printf '%s\n' "$DIGEST" > image-digest.txt
          gh release upload "$TAG" image-digest.txt --clobber
          gh release download "$TAG" --pattern image-digest.txt --output - | tr -d '[:space:]' | grep -qx "$DIGEST" \
            || { echo "the recorded digest does not read back"; exit 1; }
